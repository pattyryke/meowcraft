# Puts BlueMap on https so the Meowcraft website can show the live map, and keeps the
# DuckDNS address pointing at home. Setup steps are in the README ("Map on https").
#   cd ~/docker/meowcraft/tools/meowcraft-server-tools/caddy && docker compose up -d
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"        # optional: only used to get the https certificate
      - "443:443"
      - "443:443/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets Caddy reach BlueMap's port on the Pi
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data                      # the https certificate lives here
      - caddy_config:/config

  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    restart: unless-stopped
    env_file: .env   # uses SUBDOMAINS and TOKEN

volumes:
  caddy_data:
  caddy_config:
