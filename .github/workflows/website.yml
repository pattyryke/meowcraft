# Publishes the site/ folder to GitHub Pages (https://pattyryke.github.io/meowcraft/) whenever it changes.
# The site reads meowcraft.json and the pack downloads live, so update night doesn't need this to run.
# One-time setup: Settings > Pages > Source: "GitHub Actions".
name: Publish the website
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/website.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
